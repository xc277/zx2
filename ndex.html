<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片展示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #15161a;
    padding: 24px;
  }

  /* 图片容器：居中，自适应屏幕 */
  .pic-box {
    max-width: 1200px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .pic-box img {
    max-width: 100%;
    max-height: 92vh;      /* 不超出屏幕高度 */
    object-fit: contain;    /* 保持比例，不拉伸变形 */
    border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
    /* 防止别人直接右键保存（只能挡住一部分人） */
    -webkit-user-select: none;
    user-select: none;
  }
</style>
</head>
<body>

  <div class="pic-box">
    <!-- 换图就改这里的 src -->
    <img src="my-picture.jpg" alt="展示图片">
  </div>

</body>
</html>
